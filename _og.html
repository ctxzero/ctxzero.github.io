<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Space Grotesk';font-weight:400 700;src:url(assets/fonts/space-grotesk-latin.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 600;src:url(assets/fonts/jetbrains-mono-latin.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#07080a;color:#ece9e2;overflow:hidden;position:relative;
  font-family:'Space Grotesk',sans-serif}
.ap{position:absolute;right:26px;top:52px;width:392px;overflow:visible}
.ap .e{stroke:#2a3038;stroke-width:1;fill:none}
.ap .hot{stroke:#ccff00;stroke-width:1.3;fill:none;opacity:.30}
.ap .live{stroke:#ccff00;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-dasharray:150 560;stroke-dashoffset:330}
.ap .n{fill:#07080a;stroke:#3a424d;stroke-width:1.2}
.ap .n.on{stroke:#ccff00;stroke-width:1.5}
.ap .lb{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;fill:#767c85;text-transform:uppercase}
.ap .lb.acid{fill:#9dc400}
.glow{position:absolute;inset:0;background:radial-gradient(560px 420px at 86% 52%,rgba(204,255,0,.07),transparent 70%)}
.pad{position:relative;padding:74px 80px;height:100%;display:flex;flex-direction:column}
.eyebrow{display:flex;align-items:center;gap:16px;margin-bottom:44px}
.bkt{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.22em;color:#ccff00;
  border:1px solid rgba(204,255,0,.32);background:rgba(204,255,0,.05);padding:8px 14px}
.sep{width:90px;height:1px;background:#2a3038}
.ref{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.19em;color:#767c85;text-transform:uppercase}
h1{font-size:158px;font-weight:700;letter-spacing:-.055em;line-height:.85}
.car{display:inline-block;width:13px;height:98px;background:#ccff00;vertical-align:-6px;margin-left:10px}
.role{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:500;letter-spacing:.29em;
  text-transform:uppercase;color:#9aa0a6;margin-top:28px}
.strip{margin-top:auto;display:flex;border-top:1px solid #1c2027;padding-top:26px;gap:0}
.c{flex:1;border-right:1px solid #1c2027;padding-right:22px}
.c:first-child{flex:1.12}
.c:last-child{border-right:0}
.k{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.2em;color:#767c85;text-transform:uppercase}
.v{font-family:'JetBrains Mono',monospace;font-size:18px;color:#ece9e2;margin-top:9px}
.v.ok{color:#ccff00}
</style></head>
<body>
<svg class="ap" viewBox="-14 20 470 500" fill="none">
  <g class="e"><path d="M48 72 176 44"/><path d="M176 44 268 148"/><path d="M118 186 268 148"/>
  <path d="M268 148 356 236"/><path d="M268 148 214 272"/><path d="M60 308 118 186"/>
  <path d="M60 308 176 468"/><path d="M356 236 300 382"/><path d="M300 382 388 430"/>
  <path d="M388 430 176 468"/><path d="M214 272 356 236"/></g>
  <path class="hot"  d="M48 72 118 186 214 272 300 382 176 468"/>
  <path class="live" d="M48 72 118 186 214 272 300 382 176 468"/>
  <circle class="n" cx="176" cy="44" r="6"/><rect class="n" x="54" y="302" width="12" height="12"/>
  <circle class="n" cx="356" cy="236" r="6"/><rect class="n" x="382" y="424" width="12" height="12"/>
  <rect class="n" x="268" y="140" width="12" height="12" transform="rotate(45 274 146)"/>
  <rect class="n on" x="42" y="66" width="12" height="12"/>
  <circle class="n on" cx="118" cy="186" r="6.5"/>
  <rect class="n on" x="208" y="266" width="12" height="12"/>
  <rect class="n on" x="294" y="376" width="12" height="12" transform="rotate(45 300 382)"/>
  <circle class="n on" cx="176" cy="468" r="9"/><circle class="hot" cx="176" cy="468" r="15"/>
  <text class="lb" x="42" y="52">foothold</text>
  <text class="lb acid" x="152" y="472" text-anchor="end">domain admin</text>
</svg>
<div class="glow"></div>
<div class="pad">
  <div class="eyebrow"><span class="bkt">CTX-0</span><span class="sep"></span><span class="ref">Offensive Security · Europe</span></div>
  <h1>ctxzero<span class="car"></span></h1>
  <div class="role">Penetration Tester / Security Researcher</div>
  <div class="strip">
    <div class="c"><div class="k">Focus</div><div class="v">Web · Network · Active Directory</div></div>
    <div class="c" style="padding-left:26px"><div class="k">Certified</div><div class="v" style="font-size:15px;white-space:nowrap">CPTS · eJPT · CTI101 · CLLMSE</div></div>
    <div class="c" style="padding-left:26px"><div class="k">Status</div><div class="v ok">Open to opportunities</div></div>
  </div>
</div>
</body></html>
